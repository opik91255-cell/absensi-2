<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Data Kehadiran | HADIR</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">HADIR<span style="color:#bfdbfe">.</span><small>Panel pengelola</small></div>
<nav class="nav"><a href="index.html">Ringkasan</a><a href="peserta.html">Data Peserta</a><a href="barcode.html">QR Sesi Bersama</a><a href="sesi.html">Sesi Absensi</a><a href="scanner.html">Tampilkan QR</a><a class="active" href="kehadiran.html">Data Kehadiran</a><a href="laporan.html">Laporan</a><a href="pengaturan.html">Pengaturan</a></nav><div class="bottom nav"><button onclick="signOut()">Keluar</button></div></aside>
<main class="main"><div class="topline"><div><div class="eyebrow">Administrasi</div><h1>Data kehadiran</h1><p class="sub">Pantau catatan kehadiran seluruh peserta.</p></div><span class="pill">Admin</span></div>
<section class="panel"><div id="message" class="notice" hidden></div><div class="field"><label for="search">Cari data</label><input id="search" placeholder="Nama, nomor peserta, atau sesi"></div><div class="table-wrap"><table><thead><tr><th>Peserta</th><th>NIS/NIM</th><th>Sesi</th><th>Waktu</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabase.js"></script><script src="../assets/js/auth.js"></script>
<script>
let records=[];
document.addEventListener("DOMContentLoaded",async()=>{const p=await HADIR.guard("admin");if(!p)return;document.getElementById("search").addEventListener("input",render);await load();});
async function load(){const {data,error}=await db.from("attendance").select("id,checked_at,status,profiles(full_name,student_number),attendance_sessions(title)").order("checked_at",{ascending:false});if(error){showMessage("#message",error.message,"error");return;}records=data||[];render();}
function render(){const q=document.getElementById("search").value.toLowerCase();const list=records.filter(r=>(r.profiles?.full_name+" "+r.profiles?.student_number+" "+r.attendance_sessions?.title).toLowerCase().includes(q));document.getElementById("rows").innerHTML=list.map(r=>`<tr><td>${HADIR.escape(r.profiles?.full_name)}</td><td>${HADIR.escape(r.profiles?.student_number)}</td><td>${HADIR.escape(r.attendance_sessions?.title)}</td><td>${new Date(r.checked_at).toLocaleString("id-ID")}</td><td><span class="pill">${HADIR.escape(r.status)}</span></td><td><button class="button danger" onclick="removeAttendance('${r.id}')">Hapus</button></td></tr>`).join("")||'<tr><td colspan="6">Belum ada data kehadiran.</td></tr>';}
async function removeAttendance(id){if(!confirm("Hapus catatan kehadiran ini?"))return;const {error}=await db.from("attendance").delete().eq("id",id);if(error){showMessage("#message",error.message,"error");return;}showMessage("#message","Catatan dihapus.");await load();}
</script></body></html>
