<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Masuk | HADIR</title><link rel="stylesheet" href="assets/css/style.css"></head><body class="login-page">
<main class="login-card"><div class="eyebrow">Portal kehadiran</div><h1>Masuk ke HADIR</h1><p class="sub">Peserta masuk dengan username. Admin tetap bisa memakai email.</p>
<div id="message" class="notice" hidden></div>
<form id="loginForm"><div class="field"><label for="identity">Username / Email admin</label><input id="identity" required autocomplete="username" placeholder="Username peserta atau email admin"></div><div class="field"><label for="password">Kata sandi</label><input id="password" type="password" required autocomplete="current-password"></div><label class="remember-row"><input id="rememberDevice" type="checkbox" checked> <span><strong>Ingat perangkat ini</strong><small>Supaya tidak perlu login lagi di perangkat ini.</small></span></label><button class="button primary" style="width:100%" type="submit">Masuk</button></form>
<p class="small" style="margin-top:18px">Belum punya akun peserta? <a href="daftar.html">Daftar di sini</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/supabase.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Memeriksa...';
 const identity=document.getElementById('identity').value.trim();
 const email=identity.includes('@')?identity.toLowerCase():usernameEmail(identity);
 const {error}=await db.auth.signInWithPassword({email,password:document.getElementById('password').value});
 if(error){showMessage('#message','Username/email atau kata sandi tidak cocok.', 'error');b.disabled=false;b.textContent='Masuk';return;}
 try{const p=await currentProfile();if(!p)throw new Error('Profil belum tersedia');const next=new URLSearchParams(location.search).get('next');
 if(p.role==='participant'&&next&&/^peserta\/scan\.html(?:\?token=[a-zA-Z0-9]+)?$/.test(next)){location.href=next;return;}
 location.href=p.role==='admin'?'admin/index.html':'peserta/index.html';
 }catch(err){await db.auth.signOut();showMessage('#message','Profil akun belum tersedia. Hubungi pengelola.', 'error');b.disabled=false;b.textContent='Masuk';}
});
</script><script src="assets/js/mobile-keyboard.js"></script></body></html>
