<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan QR | HADIR</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">HADIR<span style="color:#bfdbfe">.</span><small>Portal peserta</small></div><nav class="nav"><a href="index.html">Dashboard</a><a class="active" href="barcode.html">Scan QR</a><a href="riwayat.html">Riwayat</a><a href="profil.html">Profil</a></nav><div class="bottom nav"><button onclick="signOut()">Keluar</button></div></aside>
<main class="main"><div class="topline"><div><div class="eyebrow">Portal peserta</div><h1>Scan QR Kelas</h1><p class="sub">Pindai QR yang ditampilkan admin. Pastikan nama sesi benar sebelum absen.</p></div><span class="pill">Peserta</span></div>
<section class="panel" style="max-width:640px"><div id="message" class="notice" hidden></div><div id="reader" style="max-width:450px"></div><div class="row" style="margin:14px 0"><button class="button primary" id="start" type="button">Mulai Scan Kamera</button><button class="button" id="stop" type="button" disabled>Hentikan Kamera</button></div>
<div id="details" hidden><h2 id="title"></h2><p id="date" class="sub"></p><button class="button primary" id="confirm" type="button">Absen Sekarang</button></div>
<p class="small">Jika QR dibuka melalui kamera bawaan HP, halaman ini akan langsung menampilkan informasi kelas setelah login.</p></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabase.js"></script><script src="../assets/js/auth.js"></script>
<script>
let scanner=null,token='',sessionId='';
document.addEventListener('DOMContentLoaded',async()=>{
 const {data:{user}}=await db.auth.getUser();
 if(!user){location.replace('../login.html?next='+encodeURIComponent('peserta/scan.html'+location.search));return;}
 if(!await HADIR.guard('participant'))return;
 document.getElementById('start').onclick=startScan;
 document.getElementById('stop').onclick=stopScan;
 document.getElementById('confirm').onclick=checkin;
 const initial=new URLSearchParams(location.search).get('token');if(initial)await preview(initial);
});
async function preview(value){
 let candidate=value.trim();
 try{const u=new URL(candidate);candidate=u.searchParams.get('token')||'';}catch(e){}
 if(!candidate){showMessage('#message','QR tidak berisi token sesi.','error');return;}
 const {data,error}=await db.rpc('preview_session_qr',{p_token:candidate});
 if(error||!data?.ok){document.getElementById('details').hidden=true;showMessage('#message',error?.message||data?.message||'QR tidak valid.','error');return;}
 token=candidate;sessionId=data.session_id;document.getElementById('title').textContent=data.title;
 document.getElementById('date').textContent='Tanggal: '+data.session_date;
 document.getElementById('details').hidden=false;
 document.getElementById('message').hidden=true;
 if(scanner)await stopScan();
}
async function startScan(){if(scanner)return;try{
 scanner=new Html5Qrcode('reader');
 await scanner.start({facingMode:'environment'},{fps:10,qrbox:220},text=>{if(scanner)preview(text);},()=>{});
 document.getElementById('start').disabled=true;document.getElementById('stop').disabled=false;
}catch(e){scanner=null;showMessage('#message','Kamera tidak tersedia. Gunakan HTTPS dan izinkan kamera, atau pindai QR lewat aplikasi kamera HP.','error');}}
async function stopScan(){if(!scanner)return;try{await scanner.stop();scanner.clear();}catch(e){}scanner=null;document.getElementById('start').disabled=false;document.getElementById('stop').disabled=true;}
async function checkin(){const b=document.getElementById('confirm');b.disabled=true;
 const {data,error}=await db.rpc('participant_checkin',{p_token:token});
 showMessage('#message',error?.message||data?.message||'Gagal menyimpan absensi.',data?.ok?'info':'error');
 if(!data?.ok)b.disabled=false;
}
</script></body></html>
