<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Riwayat | HADIR</title><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">HADIR<span style="color:#bfdbfe">.</span><small>Portal peserta</small></div><nav class="nav"><a href="index.html">Dashboard</a><a href="scan.html">Scan QR</a><a class="active" href="riwayat.html">Riwayat</a><a href="profil.html">Profil</a></nav><div class="bottom nav"><button onclick="signOut()">Keluar</button></div></aside>
<main class="main"><div class="topline"><div><div class="eyebrow">Portal peserta</div><h1>Riwayat kehadiran</h1><p class="sub">Hanya catatan milik akun ini yang ditampilkan.</p></div><span class="pill">Peserta</span></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Sesi</th><th>Tanggal</th><th>Waktu</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabase.js"></script><script src="../assets/js/auth.js"></script>
<script>document.addEventListener("DOMContentLoaded",async()=>{const p=await HADIR.guard("participant");if(!p)return;const {data,error}=await db.from("attendance").select("checked_at,status,attendance_sessions(title,session_date)").order("checked_at",{ascending:false});const tbody=document.getElementById("rows");if(error){tbody.innerHTML="<tr><td colspan='4'>Riwayat gagal dimuat.</td></tr>";return;}tbody.innerHTML=(data||[]).map(r=>`<tr><td>${HADIR.escape(r.attendance_sessions?.title)}</td><td>${r.attendance_sessions?.session_date||""}</td><td>${new Date(r.checked_at).toLocaleTimeString("id-ID")}</td><td><span class="pill">${HADIR.escape(r.status)}</span></td></tr>`).join("")||'<tr><td colspan="4">Belum ada riwayat.</td></tr>';});</script>
</body></html>
