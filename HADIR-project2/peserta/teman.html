<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kehadiran Kelas | HADIR</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">HADIR<span style="color:#bfdbfe">.</span><small>Portal peserta</small></div><nav class="nav"><a href="index.html">Dashboard</a><a href="scan.html">Scan QR</a><a href="riwayat.html">Riwayat</a><a class="active" href="teman.html">Kehadiran Kelas</a><a href="profil.html">Profil</a></nav><div class="bottom nav"><button onclick="signOut()">Keluar</button></div></aside><main class="main"><div class="topline"><div><div class="eyebrow">Portal peserta</div><h1>Kehadiran teman sekelas</h1><p class="sub">Daftar teman yang hadir pada sesi yang juga kamu ikuti.</p></div><span class="pill">Peserta</span></div><section class="panel"><div id="message" class="notice" hidden></div><div class="field"><label for="session">Pilih sesi yang kamu ikuti</label><select id="session"></select></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Nama</th><th>Waktu hadir</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="3">Pilih sesi.</td></tr></tbody></table></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabase.js"></script><script src="../assets/js/auth.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{const p=await HADIR.guard('participant');if(!p)return;const {data,error}=await db.from('attendance').select('session_id,attendance_sessions(title,session_date)').eq('participant_id',(await db.auth.getUser()).data.user.id).order('checked_at',{ascending:false});if(error){showMessage('#message',error.message,'error');return;}const unique=[...new Map((data||[]).map(x=>[x.session_id,{id:x.session_id,title:x.attendance_sessions?.title,date:x.attendance_sessions?.session_date}])).values()];const sel=document.getElementById('session');sel.innerHTML=unique.length?unique.map(x=>`<option value="${x.id}">${HADIR.escape(x.title)} · ${x.date}</option>`).join(''):'<option value="">Belum ada sesi yang kamu ikuti</option>';sel.onchange=load;if(unique.length)await load();});
async function load(){const id=document.getElementById('session').value;if(!id)return;const tbody=document.getElementById('rows');tbody.innerHTML='<tr><td colspan="3">Memuat...</td></tr>';const {data,error}=await db.rpc('class_attendance',{p_session_id:id});if(error){tbody.innerHTML='<tr><td colspan="3">'+HADIR.escape(error.message)+'</td></tr>';return;}tbody.innerHTML=(data||[]).map(x=>`<tr><td>${HADIR.escape(x.full_name)}</td><td>${new Date(x.checked_at).toLocaleTimeString('id-ID')}</td><td><span class="pill">${HADIR.escape(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="3">Belum ada peserta hadir.</td></tr>';}
</script></body></html>
