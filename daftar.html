<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Peserta | HADIR</title><link rel="stylesheet" href="assets/css/style.css"></head><body class="login-page"><main class="login-card"><div class="eyebrow">Portal kehadiran</div><h1>Buat akun peserta</h1><p class="sub">Daftar cukup dengan nama, username, kelas, dan password.</p><div id="message" class="notice" hidden></div>
<form id="registerForm"><div class="field"><label for="name">Nama lengkap</label><input id="name" required maxlength="100" autocomplete="name"></div><div class="field"><label for="username">Username</label><input id="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9._-]+" autocomplete="username"><small class="small">Gunakan huruf, angka, titik, garis bawah, atau strip.</small></div><div class="field"><label for="className">Kelas</label><input id="className" required maxlength="80" placeholder="Contoh: Sistem Informasi C"></div><div class="field"><label for="password">Buat password</label><input id="password" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label for="confirm">Ulangi password</label><input id="confirm" type="password" required minlength="8" autocomplete="new-password"></div><button class="button primary" style="width:100%" type="submit">Daftar akun</button></form><p class="small" style="margin-top:18px">Sudah punya akun? <a href="login.html">Masuk</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/supabase.js"></script><script>
document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;const name=document.getElementById('name').value.trim(),username=document.getElementById('username').value.trim().toLowerCase(),className=document.getElementById('className').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(password!==confirm){showMessage('#message','Konfirmasi password tidak sama.','error');return;}
 if(!/^[a-z0-9._-]{3,30}$/.test(username)){showMessage('#message','Format username tidak valid.','error');return;}
 b.disabled=true;b.textContent='Membuat akun...';
 const {data,error}=await db.auth.signUp({email:usernameEmail(username),password,options:{data:{full_name:name,username,class_name:className}}});
 if(error){showMessage('#message',error.message,'error');b.disabled=false;b.textContent='Daftar akun';return;}
 if(data.session){showMessage('#message','Akun berhasil dibuat. Mengarahkan ke dashboard...','info');location.href='peserta/index.html';return;}
 showMessage('#message','Pendaftaran diterima. Jika konfirmasi email masih aktif, matikan Email Confirmations di Supabase Auth agar akun username tanpa email bisa langsung digunakan. Setelah itu login dengan username dan password.','info');b.disabled=false;b.textContent='Daftar akun';
});
</script><script src="assets/js/mobile-keyboard.js"></script></body></html>
